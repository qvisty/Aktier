services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autotrader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autotrader}
      POSTGRES_DB: autotrader
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotrader"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    command: ["./docker-entrypoint.sh", "web"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://autotrader:${POSTGRES_PASSWORD:-autotrader}@postgres:5432/autotrader
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  trading-worker:
    build: .
    restart: unless-stopped
    command: ["./docker-entrypoint.sh", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://autotrader:${POSTGRES_PASSWORD:-autotrader}@postgres:5432/autotrader
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
