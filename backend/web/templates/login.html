{% extends "base.html" %}
{% block content %}
<div style="max-width:360px; margin:18vh auto 0;">
  <div class="brand" style="margin-bottom:16px;">
    {% include "_logo.html" %}
    <div>
      <h1>AutoTrader</h1>
      <div class="tagline"><span class="dot"></span>Self-hosted Linux / 24/7</div>
    </div>
  </div>
  <div class="card" style="margin-top:0;">
    <p class="muted" style="margin:0 0 10px;">Log ind for at se dashboardet.</p>
    {% if error %}<p class="neg num" style="margin:0 0 10px;">{{ error }}</p>{% endif %}
    <form method="post" action="/login" style="display:flex; flex-direction:column; gap:10px;">
      <input type="password" name="password" placeholder="Adgangskode" autofocus>
      <button class="primary" type="submit">Log ind</button>
    </form>
  </div>
</div>
{% endblock %}
