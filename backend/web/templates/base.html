<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoTrader</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --text:#e2e8f0; --muted:#94a3b8; --green:#4ade80; --red:#f87171; --accent:#38bdf8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); padding:16px; }
    a { color: var(--accent); }
    h1 { font-size:1.4rem; margin:0 0 4px; }
    h2 { font-size:1rem; color:var(--muted); margin:24px 0 8px; text-transform:uppercase; letter-spacing:.05em; }
    .cards { display:flex; flex-wrap:wrap; gap:12px; }
    .card { background:var(--card); border-radius:10px; padding:12px 16px; min-width:140px; flex:1; }
    .card .label { color:var(--muted); font-size:.75rem; text-transform:uppercase; }
    .card .value { font-size:1.3rem; font-weight:600; margin-top:4px; }
    table { width:100%; border-collapse:collapse; background:var(--card); border-radius:10px; overflow:hidden; font-size:.9rem; }
    th, td { text-align:left; padding:8px 12px; border-bottom:1px solid #33415555; }
    th { color:var(--muted); font-weight:500; font-size:.75rem; text-transform:uppercase; }
    .pos { color:var(--green); } .neg { color:var(--red); }
    .mode { padding:4px 12px; border-radius:999px; font-weight:700; font-size:.85rem; }
    .mode.PAPER { background:#0c4a6e; color:#7dd3fc; }
    .mode.LIVE { background:#14532d; color:#86efac; }
    .mode.STOPPED { background:#7f1d1d; color:#fca5a5; }
    button { border:0; border-radius:8px; padding:10px 16px; font-weight:700; cursor:pointer; }
    button.danger { background:#dc2626; color:white; }
    button.safe { background:#16a34a; color:white; }
    button.neutral { background:#334155; color:var(--text); }
    .topbar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
    .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .ok { color:var(--green); } .bad { color:var(--red); }
    .muted { color:var(--muted); font-size:.85rem; }
    .table-wrap { overflow-x:auto; }
    form { display:inline; }
    input[type=password] { padding:10px; border-radius:8px; border:1px solid #334155; background:var(--card); color:var(--text); }
    label.chk { font-size:.8rem; color:var(--muted); }
  </style>
  <meta http-equiv="refresh" content="60">
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
